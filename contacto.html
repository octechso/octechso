<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - OC Tech Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="contact-body">

    <!-- Navegación Superior Alineada en la línea central -->
    <header class="header-navbar">
        <div class="logo-container">
            <a href="index.html">
                <img src="assets/img/OCTECHa.png" alt="OC Tech Solutions" class="logo">
            </a>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="btn-glow">INICIO</a>
            <a href="index.html#servicios" class="btn-glow">SERVICIOS</a>
            <a href="index.html#nosotros" class="btn-glow">NOSOTROS</a>
            <a href="contacto.html" class="btn-glow active">CONTÁCTANOS</a>
        </nav>
    </header>

    <!-- Contenedor de Formulario e Información -->
    <main class="contact-container">
        
        <section class="contact-info-card">
            <h2>Ponte en Contacto</h2>
            <p>Estamos listos para atender tus requerimientos tecnológicos y de mantenimiento.</p>

            <div class="info-items">
                <a href="https://wa.me/573162925823?text=Hola,%20me%20gustaría%20obtener%20más%20información" target="_blank" class="info-item whatsapp-btn">
                    <i class="fa-brands fa-whatsapp"></i>
                    <div>
                        <span>Escríbenos a WhatsApp</span>
                        <p>+57 3162925823</p>
                    </div>
                </a>

                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <span>Correo Electrónico</span>
                        <p>contacto@octechso.com</p>
                    </div>
                </div>

                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <span>Ubicación</span>
                        <p>Pitalito, Huila - Colombia</p>
                    </div>
                </div>
            </div>

            <div class="social-media">
                <h3>Nuestras Redes</h3>
                <div class="social-icons">
                    <a href="https://facebook.com" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
            </div>
        </section>

        <section class="contact-form-card">
            <h2>Envíanos un Mensaje</h2>
            <form id="contactForm">
                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="telefono">Teléfono / WhatsApp</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+57 300 000 0000">
                </div>

                <div class="input-group">
                    <label for="mensaje">¿En qué podemos ayudarte?</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje o solicitud de servicio..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Enviar Mensaje</button>
            </form>
        </section>

    </main>

</body>
</html>
